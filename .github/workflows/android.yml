name: Android build
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Play versionCode (increase for every upload)'
        default: '1'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Assemble web content
        run: |
          mkdir -p android-app/www
          cp index.html manifest.webmanifest first-run.js ux.js smart-labels.js selfcheck.js theme.css android-app/www/
          cp -r assets models data fonts icons android-app/www/
          # the app uses the phone-optimised (lite) models, except the full-detail skull (jaw/teeth), so other full desktop copies are left out
          find android-app/www/models -maxdepth 1 -name '*.glb' ! -name 'zanatomy-skull.glb' -delete
          test -f android-app/www/models/lite/anatomyverse-limbs.glb
          test -f android-app/www/models/zanatomy-skull.glb
          du -sh android-app/www android-app/www/models
      - name: Sync Capacitor
        working-directory: android-app
        run: |
          npm ci || npm install
          npx cap sync android
      - name: Restore upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"; echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"; fi
      - name: Build
        working-directory: android-app/android
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_KEY_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEY_PASS }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --stacktrace bundleRelease assembleDebug > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            msg=$(sed -n '/What went wrong/,/Try:/p' build.log | head -14 | tr '\n' ' ' | cut -c1-1500)
            echo "::error::$msg"
            c=$(grep -nE "Caused by|at build_|build.gradle" build.log | head -8 | cut -c1-260 | tr '\n' ' ')
            echo "::error::$c"
          fi
          exit $rc
      - uses: actions/upload-artifact@v4
        with:
          name: anatomyverse-aab
          path: android-app/android/app/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: anatomyverse-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/*.apk
      - name: Verify the bundle is the real app
        run: |
          AAB=$(ls android-app/android/app/build/outputs/bundle/release/*.aab)
          unzip -l "$AAB" | grep -E "base/assets/public/(index.html|ux.js|smart-labels.js|selfcheck.js|theme.css|fonts/fonts.css|icons/icon-512.png|models/lite/anatomyverse-limbs.glb)" || { echo "::error::app files missing from the bundle"; exit 1; }
          unzip -p "$AAB" base/assets/public/ux.js | grep -q "avx-scrollx" || { echo "::error::bundle has an old ux.js"; exit 1; }
          [ "$(unzip -l "$AAB" | grep -c 'base/assets/public/assets/FcpsBank-')" -ge 5 ] || { echo "::error::FCPS question bank chunks missing from the bundle"; exit 1; }
          if jarsigner -verify "$AAB" 2>&1 | grep -q "jar verified"; then SIGN="signed"; else SIGN="NOT signed (keystore secrets missing)"; fi
          echo "::notice title=Bundle check::$(basename "$AAB") $(du -h "$AAB" | cut -f1), app files present, $SIGN, sha256 $(sha256sum "$AAB" | cut -c1-12)"
